# Dependabot – automatisiert die "langweiligen" Dependency-Updates.
#
# Sicherheitsnetz: .github/workflows/ci.yml baut + testet + lintet JEDEN PR.
# Du mergst also nur grüne PRs; ein kaputter Bump zeigt sich als roter Check
# und bleibt einfach liegen. Von-Hand-Editieren entfällt.
#
# BEWUSST AUSGENOMMEN (siehe ignore): die AGP / Kotlin / KSP-Trias. Die hängt
# an android.builtInKotlin=false + android.newDsl=false (gradle.properties) und
# muss manuell UND gemeinsam angehoben werden – nie einzeln durch einen Bot.
version: 2
updates:
  # ── Gradle-Libraries (liest gradle/libs.versions.toml) ──
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Alle harmlosen minor/patch-Updates in EINEN wöchentlichen PR bündeln.
      # Major-Updates bekommen weiterhin eigene PRs (einzeln zu reviewen).
      libraries:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # AGP
      - dependency-name: "com.android.tools.build:gradle"
      - dependency-name: "com.android.application"
      - dependency-name: "com.android.library"
      # Kotlin / KGP + Kotlin-Plugins (compose, serialization, android) –
      # teilen sich die "kotlin"-Version und können nicht einzeln wandern.
      - dependency-name: "org.jetbrains.kotlin:*"
      - dependency-name: "org.jetbrains.kotlin.*"
      # KSP – muss zur Kotlin-Version passen.
      - dependency-name: "com.google.devtools.ksp"
      - dependency-name: "com.google.devtools.ksp:*"

  # ── GitHub-Actions in der CI aktuell halten (klein, gruppiert) ──
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        update-types:
          - "minor"
          - "patch"
