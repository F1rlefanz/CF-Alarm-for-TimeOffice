name: Veroeffentlichen (interner Track)

# WANN DAS HIER LAEUFT:
#
# 1. AUTOMATISCH bei jedem Push auf main, der den `versionCode` ERHOEHT. Das ist der Ausloeser,
#    den der Eigentuemer wollte: eine neue Version soll ohne Klicken im Play Store landen. Der
#    versionCode ist dafuer das richtige Signal - er ist ohnehin bei jedem Release zu erhoehen
#    (Play lehnt eine doppelte Nummer ab), und ein reiner Doku- oder Aufraeum-Commit hat ihn
#    nicht dabei. Eine Aenderung ohne Bump loest also NICHTS aus.
# 2. VON HAND ueber "Run workflow", z. B. um einen Entwurf statt einer Veroeffentlichung zu
#    erzeugen oder einen fehlgeschlagenen Lauf zu wiederholen.
#
# WAS BEWUSST NICHT AUTOMATISCH IST: der PRODUKTIONS-Track. Hier geht es ausschliesslich auf den
# INTERNEN Track. Die Messlatte dieses Projekts bleibt "ein gruener Build ist noch KEINE
# auslieferbare Version" - gruene Tests plus gruener Build haben hier schon einen
# Crash-on-Launch durchgelassen (05.08.2026, Property nach init{}). Der interne Track ist die
# Stelle, an der so etwas auffaellt, BEVOR es jemanden weckt.

on:
  push:
    branches: [main]
    # Nur wenn die Versionsdatei angefasst wurde - alles Weitere entscheidet der Bump-Vergleich
    # im ersten Job. Spart den Lauf bei jedem gewoehnlichen Commit.
    paths:
      - 'app/build.gradle.kts'
  # Aufgerufen vom Sammel-Release (`sammel-release.yml`), nachdem der seinen Bump nach `main`
  # gepusht hat. Der Umweg ueber `workflow_call` statt eines zweiten Push-Ausloesers ist noetig,
  # weil ein Push mit dem Standard-GITHUB_TOKEN bewusst KEINE Workflows ausloest.
  workflow_call:
    inputs:
      track:
        type: string
        required: false
        default: internal
      status:
        type: string
        required: false
        default: completed
      ref:
        description: 'Stand, der gebaut werden soll - fuer den Aufrufer, der gerade gebumpt hat'
        type: string
        required: false
        default: ''

  workflow_dispatch:
    inputs:
      track:
        description: 'Play-Track'
        required: true
        default: internal
        type: choice
        options:
          - internal
      status:
        description: 'Freigabestatus im Track'
        required: true
        default: completed
        type: choice
        options:
          - completed
          - draft

concurrency:
  group: veroeffentlichen
  cancel-in-progress: false

jobs:
  # Bei einem Push: nur weitermachen, wenn der versionCode WIRKLICH gestiegen ist. Play lehnt
  # eine bereits vergebene Nummer ab - ein Lauf ohne Bump waere also nicht nur ueberfluessig,
  # sondern ein garantierter Fehlschlag, der eine rote Mail erzeugt und nichts bedeutet.
  pruefe-bump:
    runs-on: ubuntu-latest
    outputs:
      ausliefern: ${{ steps.vergleich.outputs.ausliefern }}
    steps:
      # Volle Historie, nicht zwei Commits: verglichen wird gegen den Stand VOR dem Push
      # (`github.event.before`), und der kann beliebig viele Commits zurueckliegen.
      - name: Checkout (volle Historie, fuer den Vergleich)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: versionCode mit dem Stand davor vergleichen
        id: vergleich
        run: |
          # Von Hand gestartet ODER vom Sammel-Release aufgerufen: in beiden Faellen hat der
          # Ausloeser die Entscheidung schon getroffen, der Bump-Vergleich hat hier nichts zu
          # melden. Er gilt nur fuer den Push-Ausloeser.
          if [ "${{ github.event_name }}" != "push" ] || [ -n "${{ inputs.ref }}" ]; then
            echo "Nicht durch einen Push ausgeloest - kein Bump-Vergleich noetig."
            echo "ausliefern=ja" >> "$GITHUB_OUTPUT"; exit 0
          fi
          NEU=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)

          # DER VERGLEICHSPUNKT IST DER STAND VOR DEM PUSH, NICHT HEAD~1.
          #
          # Bis zum 02.09.2026 stand hier `git show HEAD~1:...`. Das stimmt nur, wenn der
          # Bump der LETZTE Commit des Pushes ist. Wird ein Zweig gemergt oder werden mehrere
          # Commits auf einmal geschoben - der Normalfall in diesem Repo -, liegt der
          # Bump-Commit mitten drin, HEAD~1 traegt den NEUEN versionCode, und der Vergleich
          # lautet "127 -> 127". Der Lauf endet dann nach neun Sekunden GRUEN und liefert
          # nichts aus. Genau so ist v1.39.1 zunaechst liegengeblieben (Lauf 33604984677).
          # Ein Fehlschlag, der wie Erfolg aussieht, ist hier die teuerste Sorte.
          VORHER_SHA="${{ github.event.before }}"
          NULL_SHA="0000000000000000000000000000000000000000"
          BRAUCHBAR=nein
          if [ -n "$VORHER_SHA" ] && [ "$VORHER_SHA" != "$NULL_SHA" ]; then
            git cat-file -e "$VORHER_SHA^{commit}" 2>/dev/null && BRAUCHBAR=ja
          fi

          if [ "$BRAUCHBAR" = "ja" ]; then
            ALT=$(git show "$VORHER_SHA:app/build.gradle.kts" 2>/dev/null | grep -oP 'versionCode\s*=\s*\K[0-9]+' | head -1 || echo 0)
            QUELLE="Stand vor dem Push ($VORHER_SHA)"
          else
            # Neuer Zweig oder ein Force-Push, dessen alter Commit nicht mehr da ist. Dann
            # bleibt nur der alte Weg - mit derselben Fehlerrichtung wie bisher.
            ALT=$(git show HEAD~1:app/build.gradle.kts 2>/dev/null | grep -oP 'versionCode\s*=\s*\K[0-9]+' | head -1 || echo 0)
            QUELLE="HEAD~1 (Notbehelf - $VORHER_SHA nicht auffindbar)"
          fi

          echo "vorher=$ALT  jetzt=$NEU  (Quelle: $QUELLE)"
          if [ "$NEU" -gt "$ALT" ]; then
            echo "Bump $ALT -> $NEU - wird ausgeliefert."
            echo "ausliefern=ja" >> "$GITHUB_OUTPUT"
          else
            echo "Kein Bump ($ALT -> $NEU) - nichts auszuliefern."
            echo "ausliefern=nein" >> "$GITHUB_OUTPUT"
          fi

  ausliefern:
    needs: pruefe-bump
    if: needs.pruefe-bump.outputs.ausliefern == 'ja'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      # `inputs.ref` setzt nur das Sammel-Release - und zwar auf `main`, weil sein Bump-Commit
      # dort schon liegt, waehrend `github.sha` noch auf den Stand VOR dem Bump zeigt. Ohne das
      # wuerde hier die Version gebaut, die gerade ersetzt werden sollte.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          validate-wrappers: true
          cache-read-only: true

      # DIE SCHLEUSE VOR DEM UPLOAD. Dieselben Pruefungen, die lokal vor jedem Merge laufen -
      # Geheimnisse, Skills, Doku-Budget, Changelog-Seite, Code-Invarianten, Aufraeum-Reste.
      # Sie kosten Sekunden und stehen deshalb VOR dem teuren Build.
      - name: Skill-Frontmatter pruefen
        run: python3 tools/skills/pruefe_skills.py .claude/skills

      - name: Changelog-Seite gegen CHANGELOG.md pruefen
        run: python3 tools/changelog/build_changelog.py --pruefen

      - name: Doku-Budget pruefen
        run: python3 tools/doku/pruefe_budget.py --ci

      - name: Code-Invarianten pruefen (Wecker-Killer)
        run: python3 tools/invarianten/pruefe_code.py

      # Kein Upload ohne gruene Tests. --rerun-tasks, weil ein FROM-CACHE-Ergebnis hier nichts
      # beweist: es stammt womoeglich von einem anderen Stand.
      - name: Unit-Tests
        run: ./gradlew testDebugUnitTest --rerun-tasks --stacktrace

      - name: Lint (release-relevant)
        run: ./gradlew lintVitalRelease --stacktrace

      # Der Upload-Schluessel liegt als Base64-Secret. build.gradle.kts erkennt an der gesetzten
      # KEYSTORE_PASSWORD-Umgebungsvariable, dass signiert werden soll, und faellt fuer storeFile
      # auf "../cf-alarm-release.keystore" zurueck - also den Projekt-Root. Genau dorthin.
      - name: Upload-Schluessel wiederherstellen
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > cf-alarm-release.keystore

      - name: AAB bauen (signiert)
        run: ./gradlew bundleRelease --stacktrace

      # Ein UNSIGNIERTES Bundle waere hier der gefaehrliche Fall: der Upload schluege erst bei
      # Google fehl, mit einer Meldung, die auf alles Moegliche zeigt. Lieber sofort und deutlich.
      - name: Signatur pruefen
        run: |
          BUNDLE=app/build/outputs/bundle/release/app-release.aab
          test -f "$BUNDLE" || { echo "::error::$BUNDLE fehlt - Build hat kein Bundle erzeugt"; exit 1; }
          if unzip -l "$BUNDLE" | grep -qE 'META-INF/.*\.(RSA|DSA|EC)'; then
            echo "Bundle ist signiert."
          else
            echo "::error::Bundle ist NICHT signiert - Secrets pruefen (KEYSTORE_BASE64/KEYSTORE_PASSWORD/KEY_PASSWORD)"
            exit 1
          fi

      # Issue #54: Play verlangt ab Februar 2027 bei mehr als 10 MB DEX je mindestens 25 %
      # Obfuskation, Optimierung und Shrinking - abgelesen aus r8.json IM Bundle. Die Werte landen
      # im Job-Summary; verfehlt sind sie nur eine Warnung. HART ist dagegen die eingebettete
      # Mapping-Datei (proguard.map): seit die App obfuskiert, uebersetzt Play damit die
      # Absturzberichte zurueck. Fehlt sie, wird nicht hochgeladen.
      - name: R8-Kennzahlen und eingebettete Mapping-Datei pruefen
        run: python3 tools/release/r8_kennzahlen.py app/build/outputs/bundle/release/app-release.aab

      - name: Version aus dem Build lesen
        id: version
        run: |
          VN=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          VC=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          echo "name=$VN" >> "$GITHUB_OUTPUT"
          echo "code=$VC" >> "$GITHUB_OUTPUT"
          echo "Version $VN (versionCode $VC)"

      # Auf einen festen Commit gepinnt, nicht auf ein bewegliches Tag: diese Aktion bekommt den
      # Play-Publishing-Schluessel zu sehen. v1.1.5 = e738b9dd8f2476ea806d921b64aacd24f34515a5.
      - name: Auf den internen Track hochladen
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.github.f1rlefanz.cf_alarmfortimeoffice
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          # `track` ist in v1.1.5 als veraltet gemeldet; `tracks` ist der Nachfolger.
          tracks: ${{ inputs.track || 'internal' }}
          # Bei einem Push ohne Eingaben: veroeffentlichen, nicht als Entwurf liegen lassen.
          status: ${{ inputs.status || 'completed' }}
          releaseName: ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})
          # BEWUSST KEIN `mappingFile:` (Issue #54). AGP bettet die Mapping-Datei selbst ins
          # Bundle ein (BUNDLE-METADATA/com.android.tools.build.obfuscation/proguard.map, geprueft
          # im Schritt "R8-Kennzahlen ..."), und Play lehnt eine zweite ab, wenn das Bundle schon
          # eine traegt. Abgesichert in tools/release/test_r8_kennzahlen.py.

      # Der Schluessel darf den Runner nicht ueberleben. GitHub raeumt den Arbeitsbereich zwar
      # ohnehin ab, aber "ohnehin" ist bei einem Signierschluessel keine Begruendung.
      - name: Schluessel entfernen
        if: always()
        run: rm -f cf-alarm-release.keystore

      - name: Bundle als Artefakt sichern
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aab-${{ steps.version.outputs.name }}
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
          retention-days: 30

      # DIE MAPPING-DATEI IST SEIT ISSUE #54 TRAGEND: R8 benennt den App-Code um, und ein
      # Absturzprotokoll eines Testers (last_crash.txt, "Logs senden") zeigt nur noch
      # `a.b.c(SourceFile:412)`. Zurueckuebersetzt wird mit der mapping.txt GENAU DIESES Builds -
      # zuordnen laesst sie sich ueber die Zeile "Version: <name> (<code>)" im Protokoll, die
      # dem Artefaktnamen unten entspricht. Befehl (R8 steckt im AGP-builder-JAR im Gradle-Cache):
      #   JAR=$(ls ~/.gradle/caches/modules-2/files-2.1/com.android.tools.build/builder/<AGP>/*/builder-<AGP>.jar)
      #   java -cp "$JAR" com.android.tools.r8.retrace.Retrace mapping.txt last_crash.txt
      # (<AGP> = Version aus gradle/libs.versions.toml; Einzelheiten in app/proguard-rules.pro.)
      # Play haelt zusaetzlich die im Bundle eingebettete Kopie; dieses Artefakt ist die lokale.
      - name: R8-Mapping sichern
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mapping-${{ steps.version.outputs.name }}
          path: app/build/outputs/mapping/release/
          if-no-files-found: ignore
          retention-days: 90
