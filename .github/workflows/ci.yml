name: CI

on:
  push:
    branches: [main]
  pull_request:

# Laeuft immer nur der neueste Commit pro Ref; aeltere Laeufe werden abgebrochen.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # PFLICHT: app/build.gradle.kts wirft eine GradleException ohne diesen Wert
      # (keystore.properties existiert in CI nicht; der ENV-Fallback ist im Build implementiert).
      # Einmalig als Repo-Secret anlegen: Settings -> Secrets and variables -> Actions.
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Repo wird unter Windows gepflegt -> Executable-Bit des Wrappers sicherstellen.
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (Caching + Wrapper-Validierung)
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          validate-wrappers: true
          # Cache nur auf main schreiben, PRs lesen nur -> kein Cache-Thrashing.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # DOKU-GATES. Beide brauchen kein Gradle und laufen in Sekunden - sie stehen deshalb
      # VOR den teuren Schritten, damit ein Doku-Fehler nicht erst nach 20 Minuten auffaellt.
      #
      # Warum ueberhaupt: am 17.08.2026 hatten drei von acht SKILL.md ein unquotiertes ': ' in
      # der `description`. Die Dateien lagen richtig, jede eigene Pruefung war gruen - aber YAML
      # bricht an dieser Stelle, und die Oberflaeche zeigte statt der Beschreibung die
      # H1-Ueberschrift. Damit war genau der Trigger weg, fuer den die Beschreibung existiert:
      # der Skill war vorhanden und sprang praktisch nicht mehr an. Aufgefallen ist es nur durch
      # Zufall beim Blick in die geladene Skill-Liste. Das darf nicht vom Zufall abhaengen.
      - name: Skill-Frontmatter pruefen (Trigger duerfen nicht stumm ausfallen)
        run: python3 tools/skills/pruefe_skills.py .claude/skills

      # Faengt den Fall, dass CHANGELOG.md geaendert und die erzeugte Seite vergessen wurde -
      # oder umgekehrt jemand docs/changelog.html von Hand editiert hat.
      - name: Changelog-Seite gegen CHANGELOG.md pruefen
        run: python3 tools/changelog/build_changelog.py --pruefen

      # CLAUDE.md wuchs vom 22.07. bis 14.08.2026 von 24.763 auf 149.571 Zeichen - 429 unter
      # dem 150k-Limit der Harness, ohne dass es jemand bemerkte. Jede einzelne Zeile war
      # berechtigt; niemand hat die SUMME angesehen. Dieser Schritt sieht sie an.
      # Gegen die echte Historie geprueft: haette am 03.08. (46k) angeschlagen, also vor
      # dem Sprung auf 133k. Nur die Repo-Anteile - die CI sieht ~/.claude nicht.
      - name: Doku-Budget pruefen (Kontext, der in JEDER Session geladen wird)
        run: python3 tools/doku/pruefe_budget.py --ci

      # Fuenf Code-Invarianten, deren Bruch einen stummen oder verwaisten Wecker erzeugt und
      # die bisher NUR in CLAUDE.md bzw. einem Skill als Prosa standen. Alle halten beim
      # Anlegen (17.08.2026) - das ist Absicht, ein Rauchmelder wird auch nicht erst montiert,
      # wenn es brennt. Jede Pruefung ist gegen eine absichtlich eingebaute Verletzung getestet.
      # Was hier NICHT geht: Direct Boot. Dafuer gibt es tools/geraet/pruefe_direct_boot.py,
      # das ein Geraet braucht und deshalb vor einem Release von Hand laeuft.
      - name: Code-Invarianten pruefen (Wecker-Killer)
        run: python3 tools/invarianten/pruefe_code.py

      # Die einzige eigene Logik der Schleuse (alles Uebrige ruft nur die
      # Skripte oben auf). Ein Fehler darin ist still: falsch-negativ heisst,
      # ein fehlender Changelog-Eintrag rutscht durch - und genau dagegen wurde
      # die Pruefung gebaut.
      - name: Changelog-Diff-Logik der Schleuse testen
        run: python3 -m unittest discover -s tools/schleuse -p "test_*.py"

      # Die Reste, die ein Aufraeumdurchgang hinterlaesst: tote Importe, verwaiste Nutzertexte,
      # Doku-Notizen auf frisch entfernte Symbole. Bis zum 25.08.2026 fand die jedes Mal ein von
      # Hand getipptes Wegwerf-Skript, das mit der Sitzung verschwand - dieselbe Wette, die dieses
      # Projekt mit der Doku-Budget-Regel schon einmal verloren hat. In der CI laeuft nur der
      # basislose Teil (tote Importe, verwaiste Texte); den Doku-Teil kann erst die Schleuse
      # pruefen, weil er eine Aenderungs-Basis braucht.
      - name: Reste eines Aufraeumdurchgangs suchen
        run: python3 tools/aufraeumen/pruefe_reste.py --ci

      # Beide Fehlalarm-Quellen dieses Gatters sind real aufgetreten und kommen unauffaellig
      # zurueck: Operator-Importe (`by getValue`) und historische Doku-Absaetze.
      - name: Entscheidungen der Reste-Pruefung testen
        run: python3 -m unittest discover -s tools/aufraeumen -p "test_*.py"

      - name: Unit-Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # `testDebugUnitTest` uebersetzt AUSSCHLIESSLICH src/test - der androidTest-Quelltext
      # kompiliert dabei nie. Ohne diesen Schritt kann ein Instrumentierungstest monatelang
      # unuebersetzbar sein und faellt erst auf, wenn jemand ein Geraet anschliesst und ihn
      # dringend braucht. Nur kompilieren, nicht ausfuehren: Ausfuehren braucht ein Geraet, und
      # `connectedDebugAndroidTest` deinstalliert die App hinterher.
      - name: androidTest-Quelltext kompilieren (blinder Fleck von `test`)
        run: ./gradlew compileDebugAndroidTestKotlin --stacktrace

      # Der Kotlin-Compiler meldet Dinge, die kein anderes Gatter sieht (unnoetige Safe-Calls,
      # unerreichbarer Code, ungenutzte private Deklarationen) - und bis zum 25.08.2026 wurde
      # jede dieser Zeilen weggeworfen. Beim Anlegen stand genau EINE im Baum, in Code vom Vortag.
      #
      # WARUM HIER UND NICHT IN DER SCHLEUSE: Ist die Compile-Task UP-TO-DATE, gibt sie ihre
      # Warnungen nicht erneut aus - ein lokales Gatter meldete dann "sauber", ohne etwas geprueft
      # zu haben. Genau die Sorte Gatter, die luegt. Die CI baut immer frisch, hier stimmt das
      # Urteil. Und WARUM NICHT allWarningsAsErrors: das bricht den Build auch dann, wenn eine
      # neue AndroidX-Fassung etwas als deprecated markiert - ausgerechnet beim Release.
      - name: Keine Kotlin-Compiler-Warnungen im eigenen Quelltext
        run: |
          ./gradlew compileDebugKotlin compileDebugAndroidTestKotlin --stacktrace 2>&1 | tee /tmp/kotlinc.log
          grep -E "^w:.*app/src/" /tmp/kotlinc.log > /tmp/w.log || true
          grep -vE "^\s*#|^\s*$" tools/aufraeumen/warnungen_geduldet.txt > /tmp/geduldet.txt || true
          if [ -s /tmp/geduldet.txt ]; then
            grep -vFf /tmp/geduldet.txt /tmp/w.log > /tmp/offen.log || true
          else
            cp /tmp/w.log /tmp/offen.log
          fi
          if [ -s /tmp/offen.log ]; then
            cat /tmp/offen.log
            echo "::error::Kotlin-Compiler-Warnung im eigenen Quelltext. Beheben - oder, wenn sie \
              von aussen aufgezwungen ist, MIT GRUND in tools/aufraeumen/warnungen_geduldet.txt."
            exit 1
          fi

      - name: Lint (abortOnError=true wirkt als Merge-Gate)
        run: ./gradlew lintDebug --stacktrace

      - name: Debug-Build
        run: ./gradlew assembleDebug --stacktrace

      - name: Debug-APK als Artefakt
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      # RELEASE-PFAD. Bis 10.08.2026 baute die CI ausschliesslich Debug - ein kaputter
      # Release-Build waere also erst beim Ausliefern aufgefallen, und genau dort sitzt das
      # eigentliche Risiko: R8/Minify (seit 10.08.2026 aktiv) und lintVitalRelease.
      #
      # Ohne Keystore-Secret: `signingConfig` ist in build.gradle.kts an das Vorhandensein des
      # Schluessels gebunden, die APK entsteht hier also UNSIGNIERT. Das ist Absicht - geprueft
      # werden soll Shrinking/Optimierung und Release-Lint, nicht das Signieren. Eine unsignierte
      # APK laesst sich weder installieren noch hochladen, der Unterschied kann also nicht
      # unbemerkt in eine Auslieferung geraten. Signiert wird lokal beim Release.
      - name: Release-Lint (blockierende Checks der Release-Variante)
        run: ./gradlew lintVitalRelease --stacktrace

      - name: Release-Build mit R8 (unsigniert, prueft Shrinking/Optimierung)
        run: ./gradlew assembleRelease --stacktrace

      - name: Test-/Lint-Reports bei Fehler
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14
