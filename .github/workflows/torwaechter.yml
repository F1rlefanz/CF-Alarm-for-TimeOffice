# Torwaechter: entscheidet ueber die PRs, die aufraeumen.yml erzeugt hat.
#
# WARUM ES IHN GIBT
# Wer eine Aenderung schreibt, urteilt nicht ueber sie - ein Agent, der seinen
# eigenen PR bewertet, ist Partei. Und die Schleuse faengt RESTE, nicht
# ZUVIEL-WEGSCHNEIDEN: sie prueft, ob der Baum nach dem Schnitt noch haelt, nicht
# ob der Schnitt richtig war. Das kann nur ein zweites Augenpaar.
#
# WARUM ER SELBST BAUT, STATT DEN CI-STATUS ZU LESEN
# Ob ein von der Action erzeugter PR die CI ausloest, haengt daran, mit welchem
# Token gepusht wurde - mit dem Standard-GITHUB_TOKEN loest GitHub bewusst KEINE
# Workflows aus. Ein Torwaechter, der auf eine gruene Ampel wartet, die nie
# angeht, wuerde jeden PR liegen lassen. Er baut deshalb selbst. Das kostet ein
# paar Minuten und haengt an nichts.
#
# FEHLERRICHTUNG: Im Zweifel NICHT mergen. Ein liegengebliebener Aufraeum-PR
# kostet nichts, ein falsch gemergter kann einen Wecker kosten.
name: Torwaechter

on:
  schedule:
    # 06:00 UTC = 08:00 Europe/Berlin, drei Stunden nach der Runde.
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: torwaechter
  cancel-in-progress: false

jobs:
  urteilen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6.3.0

      # Zeitmarke fuer den Nachweis unten. Muss VOR der Action gesetzt werden,
      # sonst laesst sich hinterher nicht unterscheiden, ob ein Kommentar am PR
      # aus DIESEM Lauf stammt oder schon vorher dastand.
      - name: Startzeit merken
        id: start
        run: echo "ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Ohne das steht im Runner-Log nur `num_turns`. Am 25.08.2026 lief der
          # Torwaechter 21 Turns lang und hinterliess NICHTS - kein Merge, kein
          # Close, kein Kommentar -, und der Grund war nicht rekonstruierbar.
          # Ein stiller Leerlauf ist die teuerste Fehlerart, die es hier gibt.
          #
          # Genau dafuer hat sich das Mitschreiben am 02.09.2026 ausgezahlt: Lauf
          # 33498749237 (01.09., 29 min, `success`) schloss PR #48 vorbildlich ab
          # und liess PR #53 unbeurteilt liegen. Im Log steht der Grund woertlich -
          # "The three refutation agents for PR #53 are still running - I'll report
          # as soon as they return." Das Task-Werkzeug arbeitet im HINTERGRUND und
          # liefert sofort zurueck; mit diesem Satz war die Antwort fertig, die
          # Session beendet und die drei Widerleger nie eingesammelt. Dagegen steht
          # jetzt beides: die ausdrueckliche Regel im Prompt (Schritt 3) und der
          # mechanische Nachweis im Schritt "Stummen Lauf aufdecken" unten.
          show_full_output: true
          claude_args: |
            --model claude-opus-5
            --allowedTools "Bash,Read,Glob,Grep,Task,TodoWrite"
          prompt: |
            Du bist der Torwaechter der autonomen Aufraeumrunden dieses Repos. Du
            hast die Aenderungen NICHT geschrieben und bist deshalb der einzige,
            der unbefangen darueber urteilen kann.

            Lies zuerst `.claude/skills/cfalarm-altlasten-abtragen/SKILL.md` -
            dort stehen die Leitplanken, gegen die du pruefst.

            UNVERHANDELBAR, und zwar VOR allem anderen: Dieser Lauf endet NIE
            stumm. Was immer passiert - du findest keinen PR, ein Werkzeug
            fehlt, ein Befehl scheitert, du bist dir unsicher, dir geht die
            Zeit aus -, du hinterlaesst eine Spur: einen Kommentar am PR, wenn
            es einen gibt, sonst deine Antwort im Lauf-Log. Sag dabei
            ausdruecklich, WAS du geprueft hast und WORAN du haengst. Ein Lauf
            ohne Merge, ohne Close und ohne Kommentar ist ein Fehlschlag,
            selbst wenn er gruen endet.

            ARBEITE JEDEN OFFENEN PR AB, dessen Branch mit `chore/aufraeumen-`
            beginnt: `gh pr list --state open --limit 100`. Das `--limit` ist
            nicht schmueckend - ohne es zeigt gh nur 30, und mit den offenen
            Dependabot-PRs daneben faellt ein Aufraeum-PR aus der ersten Seite
            heraus und wird nie beurteilt. Gibt es keinen, melde das und hoere
            auf - nichts erfinden.

            EINEN NACH DEM ANDEREN, ganz zu Ende. Erst wenn PR A gemergt oder
            geschlossen UND kommentiert ist, faengst du mit PR B an. Zwei PRs
            gleichzeitig offen zu halten hat am 01.09.2026 genau einen von
            beiden gekostet.

            Je PR, in dieser Reihenfolge:

            1. BAU UND TESTS SELBST FAHREN, nicht den CI-Status glauben:
               `gh pr checkout <nr>`, dann
               `./gradlew assembleDebug testDebugUnitTest lintDebug`.
               Das Testurteil kommt aus `app/build/test-results/testDebugUnitTest/*.xml`,
               NIE aus dem Rueckgabewert - ein gruener Exit-Code ist in diesem
               Projekt kein gruener Testlauf. Dazu
               `python tools/invarianten/pruefe_code.py` und
               `python tools/aufraeumen/pruefe_reste.py`.
               Faellt irgendetwas davon: schliessen, mit Begruendung.

            2. GEGEN DIE LEITPLANKEN PRUEFEN. Sofort schliessen, wenn der PR
               eine davon verletzt - besonders diese:
               - Er fasst die Weckerkette an (`alarm/`, `service/`,
                 `dimmer/`-Planung, `AlarmReceiver`, `BootReceiver`).
               - Er macht etwas "schoener": umbenannt, umstrukturiert,
                 "effizienter" - das ist kein Aufraeumen.
               - Er entfernt ein gespeichertes Format (Felder, die auf echten
                 Geraeten im DataStore stehen) oder ein Modellfeld, ohne den
                 Parser geprueft zu haben.
               - Er entfernt etwas, das ausdruecklich `OHNE VERWENDER` im
                 eigenen KDoc traegt.
               - Seine Commit-Nachricht nennt keine Rohbefund- UND
                 Bestaetigungszahl.
               - ER LIEFERT EINEN SCHNITT UND EIN NEUES BLOCKIERENDES GATTER IM
                 SELBEN PR (also Aenderungen an `tools/aufraeumen/pruefe_reste.py`
                 oder `tools/schleuse/pruefe_schleuse.py` NEBEN einem Schnitt am
                 Quelltext). Seit dem 04.09.2026 verlangt Schritt 4 des Skills,
                 beides zu trennen. Der Grund ist ausgezaehlt: von neun
                 beurteilten Aufraeum-PRs wurden alle vier ohne neues Gatter
                 gemergt und alle fuenf mit einem geschlossen - nie wegen des
                 Befundes, immer wegen des Gatters. Schliesse mit dem
                 ausdruecklichen Hinweis, dass der SCHNITT unveraendert allein
                 wiederkommen darf und das Gatter als eigenes Issue gehoert.
                 Das ist eine formale Pruefung: sie kostet dich zwei Minuten
                 statt eines 40-Minuten-Baus, und sie spart der naechsten Runde
                 den Schnitt.

            3. WIDERLEGEN LASSEN, nicht bewerten. Starte mit dem Task-Werkzeug
               DREI unabhaengige Subagenten. Jeder bekommt den Diff und genau
               einen Auftrag: "Finde einen Grund, warum dieses Entfernen FALSCH
               ist - einen Verwender, den die Messung uebersehen hat, eine
               Reflexion, einen Manifest- oder res-Eintrag, einen Aufruf aus
               einem Test. Im Zweifel gilt WIDERLEGT." Sag ihnen ausdruecklich,
               dass sie NICHT bewerten, sondern widerlegen sollen.
               Widerlegen zwei oder drei: schliessen. Sonst weiter.

               ACHTUNG, hier ist dieser Lauf schon einmal gestorben: Das
               Task-Werkzeug arbeitet im HINTERGRUND. Es liefert dir sofort nur
               einen Namen zurueck, NICHT das Urteil - das kommt spaeter als
               Benachrichtigung. Ein Zug, der mit "die Widerleger laufen noch,
               ich melde mich" endet, ist eine FERTIGE ANTWORT: die Sitzung ist
               damit vorbei, die drei Urteile kommen nie an, und der PR bleibt
               unbeurteilt liegen. Genau so ging Lauf 33498749237 am 01.09.2026
               aus (PR #53, gruen gemeldet, kein Kommentar).
               Also: WARTE ihre Ergebnisse ab und beende erst DANACH deinen Zug.
               Hast du das Urteil der drei nach angemessener Zeit nicht, ist das
               kein Grund aufzuhoeren, sondern der Fall fuer Schritt 4 mit dem
               Vermerk "Widerleger nicht zurueckgekommen" - also SCHLIESSEN, denn
               im Zweifel wird nicht gemergt.

            4. ENTSCHEIDEN.
               - Alles bestanden -> `gh pr merge <nr> --merge --delete-branch`.
               - Sonst -> `gh pr close <nr> --delete-branch` und das zugehoerige
                 Aufraeum-Issue mit `gh issue reopen` wieder oeffnen, damit der
                 Blickwinkel nicht verloren geht.

                 VORHER, wenn der PR `tools/aufraeumen/nachtraege.md` aendert:
                 RETTE DIESE EINE DATEI NACH `main`. Sie ist der einzige Weg,
                 auf dem eine Runde die naechste warnen kann - `.claude/` darf
                 eine Runde nicht schreiben (eingebauter Schutz, am 03.09.2026
                 gemessen). Bleibt die Lehre im geschlossenen PR, ist sie weg
                 und die naechste Runde baut denselben Fehler nach; genau so
                 ging die Parser-Lehre aus Runde 16 verloren (PR #59,
                 04.09.2026). Der Weg:

                     git fetch origin main <branch-des-prs>
                     git checkout -B main origin/main
                     git checkout FETCH_HEAD -- tools/aufraeumen/nachtraege.md
                     git commit -m "docs(aufraeumen): Nachtrag aus dem geschlossenen PR #<nr> gerettet"
                     git push origin main

                 NUR diese Datei, nie etwas anderes aus dem PR. Scheitert der
                 Push, weil sich `main` bewegt hat: einmal mit frischem
                 `origin/main` wiederholen. Geht es dann immer noch nicht,
                 haeng den Wortlaut als Kommentar an das wiedereroeffnete
                 Issue - verlorengehen darf er nicht.
               In BEIDEN Faellen einen Kommentar an den PR, der den Grund nennt
               und die Zahlen zeigt, auf die du dich stuetzt. "Sieht gut aus"
               ist keine Begruendung.

               NIMM DAFUER `gh pr comment <nr>`, nicht `gh pr review`. Der
               Schritt, der stumme Laeufe aufdeckt, liest beide Formen, aber
               nur die erste ist auch dann noch da, wenn der PR geschlossen
               wird - und ein Review an einem fremden PR kann am Token
               scheitern, wo ein Kommentar durchgeht.

            Nichts bleibt liegen: jeder offene Aufraeum-PR ist am Ende dieses
            Laufs entweder in `main` oder geschlossen.

      # DER MECHANISCHE TEIL DER ZUSICHERUNG.
      #
      # Der Prompt sagt "dieser Lauf endet nie stumm" - aber eine Bitte ist keine
      # Zusicherung. Am 25.08. und am 01.09.2026 endete er trotzdem stumm, beide
      # Male `success`. Ein gruener Lauf, der nichts hinterlaesst, ist die
      # teuerste Fehlerart hier: er sieht aus wie Arbeit und ist keine, und
      # niemand hat einen Anlass nachzusehen.
      #
      # Deshalb prueft dieser Schritt die SPUR statt der Absicht: jeder
      # Aufraeum-PR, der schon vor dem Lauf offen war und es danach noch ist,
      # MUSS einen Kommentar aus diesem Lauf tragen. Fehlt er, wird der Lauf rot
      # und der PR bekommt den Fehlschlag angeheftet - so steht die Warnung dort,
      # wo sie beim naechsten Blick auffaellt, nicht nur im Lauf-Log.
      #
      # `if: always()`, denn ein abgebrochener oder gescheiterter Claude-Schritt
      # ist genau der Fall, in dem die Spur fehlt.
      - name: Stummen Lauf aufdecken
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEIT: ${{ steps.start.outputs.ts }}
          LAUF: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # Ohne Zeitmarke ist dieser Schritt WERTLOS, nicht bloss ungenau: ein
          # leeres $SEIT laesst `select(.createdAt < "")` fuer jeden PR falsch
          # werden, die Liste bleibt leer und der Schritt meldet Entwarnung.
          # Leer ist es genau dann, wenn "Startzeit merken" nicht lief - also
          # wenn ein Schritt davor scheiterte und folglich GAR NICHTS beurteilt
          # wurde. Das ist der Fall, fuer den `if: always()` hier steht.
          if [ -z "${SEIT:-}" ]; then
            echo "::error::Startzeit fehlt - der Lauf ist vor der Beurteilung abgebrochen."
            exit 1
          fi

          # Nur PRs, die es beim Start schon gab - ein waehrend des Laufs
          # entstandener PR konnte gar nicht beurteilt werden.
          # `--limit 100`, weil gh sonst nach 30 abschneidet und ein
          # Aufraeum-PR hinter den Dependabot-PRs unsichtbar bliebe.
          FILTER=".[] | select(.headRefName | startswith(\"chore/aufraeumen-\"))"
          FILTER="$FILTER | select(.createdAt < \"$SEIT\") | .number"
          OFFEN=$(gh pr list --state open --limit 100 --json number,headRefName,createdAt --jq "$FILTER")

          if [ -z "$OFFEN" ]; then
            echo "Kein Aufraeum-PR mehr offen, der vor $SEIT bestand - nichts liegengeblieben."
            exit 0
          fi

          STUMM=""
          for NR in $OFFEN; do
            # BEIDE Kommentarformen zaehlen. `--json comments` liefert nur die
            # gewoehnlichen Kommentare; haette der Torwaechter sein Urteil als
            # Review hinterlassen, wuerde dieser Schritt sonst einen korrekt
            # beurteilten PR als "stumm" anprangern - ein Fehlalarm an genau
            # der Stelle, deren Wert daran haengt, dass man ihr glaubt.
            # ISO-8601 in UTC vergleicht sich lexikographisch richtig.
            LETZTER=$(gh pr view "$NR" --json comments,reviews               --jq '[(.comments[]?.createdAt), (.reviews[]?.submittedAt)] | map(select(. != null)) | max // ""')
            if [ -z "$LETZTER" ] || [[ "$LETZTER" < "$SEIT" ]]; then
              STUMM="$STUMM $NR"
            fi
          done

          if [ -z "$STUMM" ]; then
            echo "Jeder noch offene Aufraeum-PR traegt einen Kommentar aus diesem Lauf."
            exit 0
          fi

          # Der Text geht ueber eine Datei, nicht als mehrzeiliges Literal:
          # eine Zeile ohne Einrueckung wuerde den YAML-Block hier beenden, und
          # das faellt erst im Lauf auf.
          {
            echo "## Torwaechter: **stumm ausgefallen**"
            echo ""
            echo "Der Lauf ist beendet, ohne diesen PR zu mergen, zu schliessen oder zu"
            echo "kommentieren. Dieser Hinweis ist automatisch erzeugt und **ersetzt kein Urteil**:"
            echo "der PR ist unbeurteilt und darf nicht als geprueft gelten."
            echo ""
            echo "Lauf: $LAUF"
            echo ""
            echo "Bekannte Ursache (Issue #52): ein Zug endete, waehrend die"
            echo "Widerleger-Subagenten noch im Hintergrund liefen. War es wieder das,"
            echo "steht 'agents are still running' im Lauf-Log."
          } > torwaechter-stumm.md

          for NR in $STUMM; do
            gh pr comment "$NR" --body-file torwaechter-stumm.md
          done

          echo "::error::Stumm gebliebene Aufraeum-PRs:$STUMM"
          exit 1
