# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# ==============================
# PERFORMANCE OPTIMIZATIONS
# ==============================

# JVM arguments optimized for Android builds
# Increased heap for large projects, optimized GC settings
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC -XX:+UseStringDeduplication -Dfile.encoding=UTF-8

# Enable parallel execution for faster builds
org.gradle.parallel=true

# Enable Gradle build cache for incremental builds
org.gradle.caching=true

# Enable configuration cache (experimental but stable)
org.gradle.configuration-cache=true

# Use Gradle daemon for faster subsequent builds
org.gradle.daemon=true

# ==============================
# ANDROID BUILD OPTIMIZATIONS
# ==============================

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
android.useAndroidX=true

# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true

# Enable incremental annotation processing
android.enableIncrementalAnnotationProcessing=true

# Enable resource shrinking optimization
android.enableResourceShrinker=true

# ==============================
# ? SECURITY CONFIGURATIONS
# ==============================

# Disable build scan uploads (avoid leaking sensitive information)
org.gradle.internal.scan.eula.disabled=true

# Enable dependency verification for security
android.dependencyResolutionManagement.repositories.enableGradleMetadata=true

# ==============================
# KOTLIN OPTIMIZATIONS
# ==============================

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Enable incremental Kotlin compilation
kotlin.incremental=true

# Enable parallel Kotlin compilation
kotlin.parallel.tasks.in.project=true

# Use Kotlin compiler caching
kotlin.compiler.execution.strategy=in-process

# ==============================
# BUILD CACHE OPTIMIZATIONS
# ==============================

# Enable build scan for performance insights (optional)
# gradle.enterprise.url=https://scans.gradle.com
# gradle.enterprise.allowUntrustedServer=true

# ==============================
# R8 OPTIMIZATIONS
# ==============================

# Enable R8 full mode for aggressive optimization
# This provides better optimization than the default mode
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
# BUILT-IN KOTLIN (AGP 9): Kotlin kommt von AGP selbst, das kotlin.android-Plugin ist deshalb
# aus app/build.gradle.kts ENTFERNT. Beide Flags standen bis v1.24.0 auf false - damals zu Recht,
# denn mit newDsl=true scheitert das kotlin.android-Plugin an einem BaseExtension-Cast.
# Gemessen am 13.08.2026 ist die Migration vollstaendig gruen: KSP + Hilt laufen, 606 Tests,
# lintDebug, lintVitalRelease und assembleRelease (R8) - die APK ist auf die Nachkommastelle
# gleich gross. Nebeneffekt: die Deprecation-Warnungen sind weg, statt nur unterdrueckt zu sein.
android.builtInKotlin=true
android.newDsl=true
# KSP 2.3.2 meldet seine generierten Quellen noch ueber kotlin.sourceSets an; built-in Kotlin
# lehnt das sonst ab ("Using kotlin.sourceSets DSL is not allowed with built-in Kotlin").
# Enger, klar begrenzter Bypass - faellt weg, sobald KSP auf android.sourceSets umstellt.
android.disallowKotlinSourceSets=false
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
