name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Die autonomen Aufraeum-PRs sind hier ausgenommen - aus zwei Gruenden.
    #
    # 1. Es geht ohnehin nicht: Die Action lehnt Bot-Ausloeser ab, um Schleifen
    #    zu verhindern (`allowed_bots` ist leer). Unsere Aufraeum-PRs oeffnet
    #    `claude[bot]`, der Lauf endet also nach ~12 s als ROT. Am 25.08.2026 auf
    #    PR #32 gemessen. Das ist kein Fehler, sieht aber wie einer aus - und ein
    #    rotes Kreuz, das nichts bedeutet, ist schlimmer als gar keins.
    # 2. Es waere doppelt: Ueber diese PRs urteilt torwaechter.yml, und zwar
    #    gruendlicher (eigener Build, Leitplanken, drei widerlegende Agenten).
    #
    # Wer das aufheben will, braucht `allowed_bots: "claude[bot]"` am Action-
    # Schritt - dann aber bewusst, mit Blick auf die Schleifengefahr.
    #
    # DEPENDABOT ist aus einem DRITTEN Grund ausgenommen, und der ist noch handfester:
    # GitHub gibt Dependabot-Laeufen die Secrets aus einem EIGENEN Speicher
    # (Settings -> Secrets -> Dependabot), nicht aus den normalen Actions-Secrets. Der
    # CLAUDE_CODE_OAUTH_TOKEN ist dort nicht hinterlegt, die Action startet also mit einem
    # LEEREN Token und stirbt nach ~9 Sekunden. Im Log steht es woertlich:
    # "Secret source: Dependabot" und `"claude_code_oauth_token": ""`.
    #
    # Fuenf Dependabot-PRs standen deshalb wochenlang mit einem roten Kreuz da, obwohl die
    # eigentliche CI (build-test-lint) auf allen gruen durchlief - und ein rotes Kreuz, das
    # nichts bedeutet, haelt echte Arbeit auf. Wer den Review auf Dependabot-PRs wirklich
    # will, hinterlegt das Token zusaetzlich unter den Dependabot-Secrets; er bezahlt es dann
    # mit einem Modell-Lauf pro Versions-Bump.
    if: >-
      ${{ !startsWith(github.event.pull_request.head.ref, 'chore/aufraeumen-')
          && github.actor != 'dependabot[bot]' }}

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

